# VPS overlay: no Caddy — join existing xpay nginx network (deploy_default)
services:
  app:
    container_name: newsplus-app
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      PUSH_STORE_PATH: /data/push-subscriptions.json
      EDITORIAL_STORE_PATH: /data/editorial.sqlite
      NODE_OPTIONS: --experimental-sqlite
    volumes:
      - newsplus_data:/data
    networks:
      - deploy_default
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  deploy_default:
    external: true

volumes:
  newsplus_data:
