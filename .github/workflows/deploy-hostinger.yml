name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

env:
  HOSTINGER_DOMAIN: deepskyblue-ibis-463603.hostingersite.com
  HOSTINGER_BASE: /home/u358087675/domains/deepskyblue-ibis-463603.hostingersite.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and API
        run: npm run build

      - name: Create deploy bundle
        run: |
          test -f newsplus-front/dist/index.html
          test -f newsplus-API/dist/server.js
          rm -rf .deploy
          mkdir -p .deploy/public .deploy/dist .deploy/scripts
          cp -a newsplus-front/dist/. .deploy/public/
          cp -a newsplus-API/dist/. .deploy/dist/
          cp newsplus-API/server.cjs newsplus-API/server.js newsplus-API/package.json newsplus-API/package-lock.json .deploy/
          cp scripts/hostinger-finish-deploy.sh scripts/hostinger-public.deepskyblue.htaccess scripts/hostinger-preload-timestamp.js .deploy/scripts/
          tar -czf newsplus-deploy.tgz -C .deploy .
          ls -la newsplus-deploy.tgz

      - name: Upload deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: newsplus-deploy.tgz
          target: /tmp/

      - name: Extract bundle and finish deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            BASE="${{ env.HOSTINGER_BASE }}"
            NODE_APP="${BASE}/hbuilds/current/nodejs"
            SCRIPTS="${BASE}/repos/NewsPulse-AI/scripts"
            WORK="/tmp/newsplus-deploy-$$"
            BUNDLE="$(find /tmp -maxdepth 2 -name 'newsplus-deploy.tgz' -type f | head -n 1)"
            if [ -z "${BUNDLE}" ]; then
              echo "Deploy bundle not found under /tmp"
              exit 1
            fi
            mkdir -p "${WORK}" "${NODE_APP}/public" "${NODE_APP}/dist" "${SCRIPTS}"
            tar -xzf "${BUNDLE}" -C "${WORK}"
            rsync -a --delete "${WORK}/public/" "${BASE}/public_html/"
            rsync -a --delete "${WORK}/public/" "${NODE_APP}/public/"
            rsync -a --delete "${WORK}/dist/" "${NODE_APP}/dist/"
            cp "${WORK}/server.cjs" "${WORK}/server.js" "${WORK}/package.json" "${WORK}/package-lock.json" "${NODE_APP}/"
            cp "${WORK}/scripts/"* "${SCRIPTS}/"
            sed -i 's/\r$//' "${SCRIPTS}/hostinger-finish-deploy.sh"
            bash "${SCRIPTS}/hostinger-finish-deploy.sh"
            rm -rf "${WORK}" "${BUNDLE}"

      - name: Verify production health
        run: |
          url="https://${HOSTINGER_DOMAIN}/api/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q '"status":"ok"'; then
              echo "Health check passed: $url"
              exit 0
            fi
            echo "Waiting for API... ($attempt/6)"
            sleep 10
          done
          echo "Health check failed: $url"
          exit 1
