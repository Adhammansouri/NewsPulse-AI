name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          script: |
            REPO="/home/u358087675/domains/darkred-sparrow-645513.hostingersite.com/repos/NewsPulse-AI"
            if [ ! -d "$REPO/.git" ]; then
              mkdir -p "$(dirname "$REPO")"
              git clone "git@github.com:Adhammansouri/NewsPulse-AI.git" "$REPO"
            fi
            bash "$REPO/scripts/deploy-hostinger.sh"
