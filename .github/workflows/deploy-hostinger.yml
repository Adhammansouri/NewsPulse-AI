name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

env:
  HOSTINGER_DOMAIN: deepskyblue-ibis-463603.hostingersite.com
  HOSTINGER_BASE: /home/u358087675/domains/deepskyblue-ibis-463603.hostingersite.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Build frontend and API
        run: |
          npm run build --workspace=newsplus-front
          npm run build --workspace=newsplus-API

      - name: Upload frontend to public_html
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: newsplus-front/dist/*
          target: ${{ env.HOSTINGER_BASE }}/public_html/
          rm: true
          strip_components: 2

      - name: Upload frontend to Node public
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: newsplus-front/dist/*
          target: ${{ env.HOSTINGER_BASE }}/hbuilds/current/nodejs/public/
          rm: true
          strip_components: 2

      - name: Upload API dist
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: newsplus-API/dist/*
          target: ${{ env.HOSTINGER_BASE }}/hbuilds/current/nodejs/dist/
          rm: true
          strip_components: 2

      - name: Upload API entry files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: newsplus-API/server.cjs,newsplus-API/server.js,newsplus-API/package.json,newsplus-API/package-lock.json
          target: ${{ env.HOSTINGER_BASE }}/hbuilds/current/nodejs/
          strip_components: 1

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: scripts/hostinger-finish-deploy.sh,scripts/hostinger-public.deepskyblue.htaccess,scripts/hostinger-preload-timestamp.js
          target: ${{ env.HOSTINGER_BASE }}/repos/NewsPulse-AI/scripts/
          strip_components: 1

      - name: Finish deploy on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            sed -i 's/\r$//' '${{ env.HOSTINGER_BASE }}/repos/NewsPulse-AI/scripts/hostinger-finish-deploy.sh'
            bash '${{ env.HOSTINGER_BASE }}/repos/NewsPulse-AI/scripts/hostinger-finish-deploy.sh'

      - name: Verify production health
        run: |
          url="https://${HOSTINGER_DOMAIN}/api/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q '"status":"ok"'; then
              echo "Health check passed: $url"
              exit 0
            fi
            echo "Waiting for API... ($attempt/6)"
            sleep 10
          done
          echo "Health check failed: $url"
          exit 1
