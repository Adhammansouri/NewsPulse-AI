name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

env:
  HOSTINGER_DOMAIN: deepskyblue-ibis-463603.hostingersite.com
  HOSTINGER_BASE: /home/u358087675/domains/deepskyblue-ibis-463603.hostingersite.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Build frontend and API
        run: |
          npm run build --workspace=newsplus-front
          npm run build --workspace=newsplus-API

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add Hostinger to known_hosts
        run: ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "mkdir -p '${HOSTINGER_BASE}/public_html' \
                       '${HOSTINGER_BASE}/hbuilds/current/nodejs/public' \
                       '${HOSTINGER_BASE}/hbuilds/current/nodejs/dist' \
                       '${HOSTINGER_BASE}/repos/NewsPulse-AI/scripts'"

      - name: Upload frontend bundle
        run: |
          tar -C newsplus-front/dist -czf /tmp/newsplus-front.tgz .
          scp -P "${{ secrets.HOSTINGER_SSH_PORT }}" /tmp/newsplus-front.tgz \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/tmp/newsplus-front.tgz"
          ssh -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "rm -rf '${HOSTINGER_BASE}/public_html/'* && \
             tar -xzf /tmp/newsplus-front.tgz -C '${HOSTINGER_BASE}/public_html' && \
             rm -f /tmp/newsplus-front.tgz && \
             rm -rf '${HOSTINGER_BASE}/hbuilds/current/nodejs/public/'* && \
             mkdir -p '${HOSTINGER_BASE}/hbuilds/current/nodejs/public' && \
             tar -C '${HOSTINGER_BASE}/public_html' -czf /tmp/newsplus-front-node.tgz . && \
             tar -xzf /tmp/newsplus-front-node.tgz -C '${HOSTINGER_BASE}/hbuilds/current/nodejs/public' && \
             rm -f /tmp/newsplus-front-node.tgz"

      - name: Upload API runtime
        run: |
          tar -C newsplus-API/dist -czf /tmp/newsplus-api-dist.tgz .
          scp -P "${{ secrets.HOSTINGER_SSH_PORT }}" /tmp/newsplus-api-dist.tgz \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/tmp/newsplus-api-dist.tgz"
          scp -P "${{ secrets.HOSTINGER_SSH_PORT }}" \
            newsplus-API/server.cjs newsplus-API/server.js newsplus-API/package.json newsplus-API/package-lock.json \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${HOSTINGER_BASE}/hbuilds/current/nodejs/"
          ssh -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "rm -rf '${HOSTINGER_BASE}/hbuilds/current/nodejs/dist/'* && \
             tar -xzf /tmp/newsplus-api-dist.tgz -C '${HOSTINGER_BASE}/hbuilds/current/nodejs/dist' && \
             rm -f /tmp/newsplus-api-dist.tgz"

      - name: Upload deploy scripts
        run: |
          scp -P "${{ secrets.HOSTINGER_SSH_PORT }}" \
            scripts/hostinger-finish-deploy.sh \
            scripts/hostinger-public.deepskyblue.htaccess \
            scripts/hostinger-preload-timestamp.js \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${HOSTINGER_BASE}/repos/NewsPulse-AI/scripts/"

      - name: Finish deploy on server
        run: |
          ssh -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "bash '${HOSTINGER_BASE}/repos/NewsPulse-AI/scripts/hostinger-finish-deploy.sh'"

      - name: Verify production health
        run: |
          url="https://${HOSTINGER_DOMAIN}/api/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q '"status":"ok"'; then
              echo "Health check passed: $url"
              exit 0
            fi
            echo "Waiting for API... ($attempt/6)"
            sleep 10
          done
          echo "Health check failed: $url"
          exit 1
