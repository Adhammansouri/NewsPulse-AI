name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck shared
        run: npm run typecheck -w @newsplus/shared

      - name: Typecheck API
        run: npm run typecheck -w newsplus-API

      - name: Typecheck frontend
        run: npm run typecheck -w newsplus-front

      - name: Build API
        run: npm run build -w newsplus-API

      - name: Build frontend
        run: npm exec -w newsplus-front -- vite build
