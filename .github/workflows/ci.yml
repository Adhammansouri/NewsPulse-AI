name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install lightningcss-linux-x64-gnu@1.33.0 @rolldown/binding-linux-x64-gnu@1.2.4 -w newsplus-front --force

      - name: Build API
        run: npm run build -w newsplus-API

      - name: Build frontend
        run: npm exec -w newsplus-front -- vite build
