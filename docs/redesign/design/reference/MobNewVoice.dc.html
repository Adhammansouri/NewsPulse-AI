<header class="m-bar"><a class="icon-btn" href="MobStory.dc.html" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><span class="badge badge--ai">منشور سوشيال</span><span class="vchip" aria-current="true">ن١</span><span class="grow"></span><button class="btn btn--ink btn--sm" type="button"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h11v11H9zM5 15H4V4h11v1"></path></svg>نسخ الكل</button></header>
<main class="m-scroll col" style="padding:14px 18px;gap:6px;opacity:.55" aria-hidden="true">
  <div class="block"><div class="block__label">الخطاف</div><p class="t-display" style="font-size:19px">المركزي يثبّت الفائدة للمرة الثالثة.. والتضخم ما زال فوق المستهدف</p></div>
  <div class="block"><div class="block__label">النص</div><p class="t-body" style="color:var(--ink);font-size:15px">قررت لجنة السياسة النقدية الإبقاء على أسعار الفائدة دون تغيير للمرة الثالثة على التوالي…</p></div>
</main>
<section class="col" aria-live="polite" style="flex:none;padding:18px 18px 28px;gap:14px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -18px 40px -24px rgb(12 35 64 / .35);border-radius:26px 26px 0 0">

  <p style="font-size:17px;line-height:1.8;font-weight:500">اختصر النص لجملتين وخلّي الخطاف سؤال <span style="color:var(--ink-3)">عن القروض</span><span style="display:inline-block;width:2px;height:20px;background:var(--cyan-dot);vertical-align:middle;margin-inline-start:2px"></span></p>
  <div class="wave" style="justify-content:center"><i style="height:14px;animation-delay:0.00s"></i><i style="height:26px;animation-delay:0.10s"></i><i style="height:36px;animation-delay:0.20s"></i><i style="height:22px;animation-delay:0.30s"></i><i style="height:32px;animation-delay:0.15s"></i><i style="height:40px;animation-delay:0.05s"></i><i style="height:18px;animation-delay:0.25s"></i><i style="height:30px;animation-delay:0.35s"></i><i style="height:24px;animation-delay:0.12s"></i><i style="height:38px;animation-delay:0.22s"></i><i style="height:16px;animation-delay:0.32s"></i><i style="height:28px;animation-delay:0.08s"></i><i style="height:34px;animation-delay:0.18s"></i><i style="height:20px;animation-delay:0.28s"></i></div>

  <p class="t-meta" style="text-align:center">بالعربي أو الإنجليزي · هيتبعت للمحرّر أول ما توقف</p>
</section>
