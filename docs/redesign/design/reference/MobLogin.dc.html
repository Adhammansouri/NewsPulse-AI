<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Newsplus موبايل — تسجيل الدخول</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7948739173ca9aa8eabbee69443cef0f">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="np m" data-theme="{{theme}}" dir="{{dir}}" lang="{{lang}}" style="background: var(--surface); direction: {{dir}}; font-family: {{font}}">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="np-ai-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"></stop><stop offset="1" stop-color="#38bdf8"></stop></linearGradient></defs></svg>
  <div class="row" style="padding: 14px 16px 0; justify-content: space-between">
    <span class="row"><img src="/_blob/c65b65ef75087372ddc981be3cc41199" alt="" style="width: 34px; height: 34px; border-radius: 10px"><b style="font-size: 17px">Newsplus</b></span>
    <span class="row" style="gap: 2px"><button class="icon-btn" type="button" aria-label="{{t.dark}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button><button class="btn btn--ghost btn--sm" type="button">{{t.switchLang}}</button></span>
  </div>

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
    <div class="m-scroll col" style="padding: 16px 20px; gap: 16px">
      <div class="col" style="position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 14px; background: #0c2340; color: #fff; gap: 6px">
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, rgb(14 165 233 / .35), transparent 55%), radial-gradient(circle at 0% 100%, rgb(13 155 138 / .35), transparent 55%)"></div>
        <p style="position: relative; font-family: {{displayFont}}; font-size: 21px; line-height: 1.45; font-weight: 700">{{t.hero}}</p>
        <svg class="pulse-line" width="100%" height="34" viewBox="0 0 320 34" preserveAspectRatio="none" style="position: relative" aria-hidden="true"><path class="base" d="M0 17h110l10-12 14 24 12-18 8 6h166" style="stroke: rgb(255 255 255 / .12)"></path><path d="M0 17h110l10-12 14 24 12-18 8 6h166"></path></svg>
      </div>
      <header class="col" style="gap: 2px"><h1 class="t-display" style="font-family: {{displayFont}}">{{t.title}}</h1><p class="t-small">{{t.subtitle}}</p></header>
      <sc-if value="{{hasAlert}}" hint-placeholder-val="{{ false }}"><div class="notice {{alertCls}} arrive" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: {{alertColor}}; margin-top: 2px"><path d="{{alertIcon}}"></path></svg><span>{{alertText}}</span></div></sc-if>
      <div class="col" style="gap: 8px"><label class="t-label" for="ml-id">{{t.idLabel}}</label><div class="field {{errCls}}" style="min-height: 50px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"></path></svg><input id="ml-id" autocomplete="username" value="{{idVal}}" placeholder="{{t.idPh}}" readOnly="{{ true }}"></div><sc-if value="{{isValidation}}" hint-placeholder-val="{{ false }}"><p class="hint hint--error">{{t.idRequired}}</p></sc-if></div>
      <div class="col" style="gap: 8px"><label class="t-label" for="ml-pw">{{t.pwLabel}}</label><div class="field {{errCls}}" style="min-height: 50px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"></path></svg><input id="ml-pw" type="password" autocomplete="current-password" value="{{pwVal}}" placeholder="{{t.pwPh}}" readOnly="{{ true }}"><button class="icon-btn" type="button" aria-label="{{t.show}}" style="margin-inline-end: -10px"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></button></div><sc-if value="{{isValidation}}" hint-placeholder-val="{{ false }}"><p class="hint hint--error">{{t.pwRequired}}</p></sc-if></div>
      <div class="row" style="justify-content: space-between; font-size: 14px">
        <label class="row" style="gap: 8px"><span class="check is-on"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>{{t.remember}}</label>
        <a href="MobLogin-forgot.dc.html" style="font-weight: 600">{{t.forgot}}</a>
      </div>
    </div>
    <div class="m-cta" style="border-top: 0">
      <sc-if value="{{isLocked}}" hint-placeholder-val="{{ false }}"><p class="m-cta__hint num">{{t.lockedIn}}</p></sc-if>
      <a class="btn btn--ink btn--block btn--lg" href="MobHome.dc.html" style="opacity: {{ctaOpacity}}">{{t.submit}}</a>
    </div>
  </sc-if>

  <sc-if value="{{isForgot}}" hint-placeholder-val="{{ false }}">
    <div class="m-scroll col enter" style="padding: 28px 20px; gap: 18px">
      <span class="ic-wrap ic-wrap--teal" style="width: 56px; height: 56px; border-radius: 18px"><svg class="ic ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"></path></svg></span>
      <header class="col" style="gap: 6px"><h1 class="t-display" style="font-family: {{displayFont}}">{{t.forgotTitle}}</h1><p class="t-small">{{t.forgotText}}</p></header>
      <div class="m-list"><div class="m-item"><span class="avatar" style="border: 0">{{t.adminInitial}}</span><span class="m-item__label">{{t.adminName}}<small dir="ltr">admin@newsplus.app</small></span></div></div>
    </div>
    <div class="m-cta" style="border-top: 0"><a class="btn btn--ink btn--block btn--lg" href="mailto:admin@newsplus.app">{{t.contact}}</a><a class="btn btn--ghost btn--block" href="MobLogin.dc.html">{{t.back}}</a></div>
  </sc-if>
</div>
</x-dc>

</script>
</body>
</html>
