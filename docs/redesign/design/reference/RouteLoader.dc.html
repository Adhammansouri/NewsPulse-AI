<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Newsplus — لودر التنقل</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7948739173ca9aa8eabbee69443cef0f">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="np" data-theme="{{theme}}" style="display: flex; width: 100%; height: 900px; overflow: hidden">
  <nav class="rail" aria-label="التنقل الرئيسي">
    <img class="rail__logo" src="/_blob/c65b65ef75087372ddc981be3cc41199" alt="Newsplus">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <button type="button" class="rail__item {{n.cls}}" aria-current="{{n.cur}}" onClick="{{n.go}}" style="border: 0; background: {{n.bg}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.path}}"></path></svg>{{n.label}}</button>
    </sc-for>
    <div style="flex: 1"></div>
    <span class="avatar">س</span>
  </nav>

  <main class="grow col" style="position: relative; background: var(--bg)">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div class="route-bar" role="progressbar" aria-label="جاري فتح الصفحة"></div></sc-if>
    <div class="row" style="padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--line)">
      <span class="t-meta">اضغط أي قسم في الشريط الجانبي</span><span class="grow"></span>
      <span class="badge badge--teal">{{status}}</span>
    </div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div class="grow col" style="padding: 30px 36px; gap: 18px">
        <div class="sk" style="height: 30px; width: 260px"></div>
        <sc-if value="{{skSplit}}" hint-placeholder-val="{{ false }}">
          <div class="row grow" style="align-items: stretch; gap: 20px">
            <div class="panel col" style="width: 380px; padding: 18px; gap: 16px"><div class="sk" style="height: 44px"></div><div class="sk" style="height: 64px"></div><div class="sk" style="height: 64px"></div><div class="sk" style="height: 64px"></div></div>
            <div class="panel grow col" style="padding: 26px; gap: 14px"><div class="sk" style="height: 28px; width: 70%"></div><div class="sk" style="height: 14px"></div><div class="sk" style="height: 14px; width: 90%"></div><div class="row" style="margin-top: 14px"><div class="sk" style="height: 120px; width: 33%"></div><div class="sk" style="height: 120px; width: 33%"></div><div class="sk" style="height: 120px; width: 33%"></div></div></div>
          </div>
        </sc-if>
        <sc-if value="{{skStack}}" hint-placeholder-val="{{ false }}">
          <div class="panel" style="height: 150px"><div class="sk" style="height: 100%; border-radius: 20px"></div></div>
          <div class="row" style="align-items: stretch; gap: 18px"><div class="panel grow" style="height: 260px; padding: 18px"><div class="sk" style="height: 100%"></div></div><div class="panel grow" style="height: 260px; padding: 18px"><div class="sk" style="height: 100%"></div></div></div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <div class="grow col enter" style="padding: 30px 36px; gap: 18px">
        <h1 class="t-hero" style="font-size: 30px">{{title}}</h1>
        <p class="t-small" style="max-width: 60ch">{{desc}}</p>
        <div class="row" style="gap: 16px; align-items: stretch">
          <div class="ai-panel col" style="flex: 1; padding: 22px; gap: 8px"><span class="ai-mark t-ai">جاهز</span><span class="t-head">{{cardA}}</span></div>
          <div class="panel col" style="flex: 1; padding: 22px; gap: 8px"><span class="t-meta">بعد كده</span><span class="t-head">{{cardB}}</span></div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { page: 'home', target: null }; }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    var self = this, st = this.state;
    var P = {
      home: { label: 'الرئيسية', path: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', title: 'صباح الخير، سارة', desc: 'الصفحة فتحت بعد ما الهيكل ظهر فوراً، فالمستخدم ما حسّش بانتظار.', a: 'ابدأ من رابط أو فكرة', b: 'كمّل شغلك', sk: 'stack' },
      news: { label: 'الأخبار', path: 'M4 5h13v14H5a1 1 0 0 1-1-1zM17 9h3v9a1 1 0 0 1-2 0M7 9h7M7 13h7M7 16h4', title: 'الأخبار', desc: 'هيكل عمودين: العناوين والخبر، بنفس أماكن المحتوى الحقيقي.', a: 'اختار خبر واكتب عنه', b: 'موجز الساعة', sk: 'split' },
      gen: { label: 'توليد', path: 'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4', title: 'توليد', desc: 'الإدخال يظهر الأول عشان المستخدم يبدأ يكتب قبل ما الباقي يكمّل.', a: 'الصق رابط الخبر', b: 'مسوداتك', sk: 'split' },
      tr: { label: 'ترجمة', path: 'M4 5h9M8.5 3v2M11 5c-1 4-4 7-7 8M6 9c1.5 2 3.5 3.5 6 4M13 21l4-10 4 10M14.5 17.5h5', title: 'ترجمة صحفية', desc: 'لوحين متساويين، الأصل والترجمة، جاهزين قبل وصول البيانات.', a: 'الصق النص أو الرابط', b: 'راجع سطر بسطر', sk: 'stack' }
    };
    var loading = !!st.target;
    var shown = P[st.page];
    var skind = loading ? P[st.target].sk : '';
    return {
      theme: this.props.theme ?? 'light',
      nav: Object.keys(P).map(function (k) {
        var cur = (loading ? st.target : st.page) === k;
        return { label: P[k].label, path: P[k].path, cur: cur ? 'page' : 'false', cls: loading && st.target === k ? 'is-loading' : '', bg: cur ? 'rgb(45 212 191 / .14)' : 'transparent',
          go: function () { if (k === self.state.page && !self.state.target) return; if (self.t) clearTimeout(self.t); self.setState({ target: k }); self.t = setTimeout(function () { self.setState({ page: k, target: null }); }, 1100); } };
      }),
      loading: loading, ready: !loading, skSplit: skind === 'split', skStack: skind === 'stack',
      status: loading ? 'جاري فتح ' + P[st.target].label + '…' : 'مفتوحة: ' + shown.label,
      title: shown.title, desc: shown.desc, cardA: shown.a, cardB: shown.b
    };
  }
}
</script>
</body>
</html>
