<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Newsplus — أول تشغيل</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7948739173ca9aa8eabbee69443cef0f">
<link rel="stylesheet" href="/_blob/210170dd5a2fa534503e7d6a475c3fc9">
<link rel="stylesheet" href="/_blob/a7940d8c65f26d316bd1f2cee73fd657">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="np m" data-theme="{{theme}}">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="np-ai-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9b8a"></stop><stop offset="1" stop-color="#0ea5e9"></stop></linearGradient></defs></svg>

<div class="row" style="padding:16px 18px 0;justify-content:space-between"><span class="row"><img src="/_blob/c65b65ef75087372ddc981be3cc41199" alt="" style="width:32px;height:32px;border-radius:9px"><b style="font-family:var(--f-display)">Newsplus</b></span><button class="btn btn--ghost btn--sm" type="button">تخطّي</button></div>
<div class="col" style="padding:18px 20px 6px;gap:10px"><span class="t-meta">الخطوة {{stepNum}} من ٣</span><div class="stepper"><i class="{{s1}}"></i><i class="{{s2}}"></i><i class="{{s3}}"></i></div><h1 class="t-display" style="font-size:24px">{{title}}</h1><p class="t-small">{{sub}}</p></div>
<main class="m-scroll col" style="padding:10px 20px 16px;gap:8px">
  <sc-if value="{{is1}}" hint-placeholder-val="{{ true }}"><button class="tile tile--row" type="button" aria-pressed="true" style="padding:14px"><span class="col grow"><b style="font-size:15px">X</b><span class="t-meta">منشورات قصيرة وعاجل</span></span><span class="check is-on"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:14px"><span class="col grow"><b style="font-size:15px">إنستجرام</b><span class="t-meta">كاروسيل وصور</span></span><span class="check is-on"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button><button class="tile tile--row" type="button" aria-pressed="false" style="padding:14px"><span class="col grow"><b style="font-size:15px">فيسبوك</b><span class="t-meta">منشورات أطول</span></span><span class="check "></span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:14px"><span class="col grow"><b style="font-size:15px">تيليجرام</b><span class="t-meta">قناة أخبار</span></span><span class="check is-on"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button><button class="tile tile--row" type="button" aria-pressed="false" style="padding:14px"><span class="col grow"><b style="font-size:15px">تيك توك</b><span class="t-meta">سكريبتات فيديو</span></span><span class="check "></span></button></sc-if>
  <sc-if value="{{is2}}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#0f6e5d">ع</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">العربية</span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#1d4ed8">س</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">سكاي نيوز عربية</span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#a16207">ج</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">الجزيرة نت</span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#b91c1c">B</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">BBC عربي</span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#c2410c">ش</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">الشرق</span></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#6d28d9">ع</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">العين</span></button><button class="tile tile--row" type="button" aria-pressed="false" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#c2410c">R</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">Reuters</span></button><button class="tile tile--row" type="button" aria-pressed="false" style="padding:10px;gap:10px"><span class="mark" style="width:30px;height:30px;border-radius:9px;background:#334155">AP</span><span class="grow" style="font-size:13.5px;font-weight:600;text-align:start">AP News</span></button></div><p class="t-meta" style="margin-top:6px">تقدر تضيف أو تشيل مصادر بعدين من التصفية.</p></sc-if>
  <sc-if value="{{is3}}" hint-placeholder-val="{{ false }}"><p class="t-label">نفس الخبر، ٣ أساليب:</p><button class="tile tile--row" type="button" aria-pressed="false" style="padding:14px;align-items:flex-start"><span class="badge badge--topic">مباشر</span><b class="grow" style="font-size:14.5px;line-height:1.6">المركزي يثبّت الفائدة للمرة الثالثة على التوالي</b></button><button class="tile tile--row" type="button" aria-pressed="true" style="padding:14px;align-items:flex-start"><span class="badge badge--ai">سؤال</span><b class="grow" style="font-size:14.5px;line-height:1.6">هل انتهى زمن خفض الفائدة؟ المركزي يثبّتها للمرة الثالثة</b></button><button class="tile tile--row" type="button" aria-pressed="false" style="padding:14px;align-items:flex-start"><span class="badge badge--topic">رقم</span><b class="grow" style="font-size:14.5px;line-height:1.6">٣ مرات ورا بعض: المركزي ما بيتحركش قبل التضخم</b></button><div class="ai-panel row" style="padding:12px 14px;gap:10px;box-shadow:none;margin-top:6px"><svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg><span class="t-small grow">هيتحفظ كقاعدة في ذاكرة الفريق ويتطبّق من أول مسودة.</span></div></sc-if>
</main>
<div class="m-cta"><div class="row" style="gap:8px"><sc-if value="{{hasBack}}" hint-placeholder-val="{{ false }}"><button class="btn btn--ghost" type="button">رجوع</button></sc-if><a class="btn {{ctaCls}} btn--lg grow" href="{{next}}">{{cta}}</a></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["one","two","three"],"default":"one"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.props.state ?? 'one';
    return { theme: this.props.theme ?? 'light', s: s, stepNum: {one:'١',two:'٢',three:'٣'}[s], s1: 'on', s2: s !== 'one' ? 'on' : '', s3: s === 'three' ? 'on' : '', is1: s === 'one', is2: s === 'two', is3: s === 'three', hasBack: s !== 'one', title: {one:'بتنشر فين؟',two:'بتتابع مين؟',three:'علّم المحرّر أسلوبك'}[s], sub: {one:'هنجهّز الصيغ وحدود الحروف على مقاس منصاتك.',two:'العناوين هتيجي من المصادر دي بس.',three:'اختار الخطاف الأقرب للي بتكتبه.'}[s], cta: s === 'three' ? 'ابدأ الشغل' : 'التالي', ctaCls: s === 'three' ? 'btn--ai' : 'btn--ink', next: s === 'one' ? 'MobOnboard-two.dc.html' : (s === 'two' ? 'MobOnboard-three.dc.html' : 'MobNewDigest.dc.html') };
  }
}
</script>
</body>
</html>
