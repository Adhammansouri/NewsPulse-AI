<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Newsplus — شاشة البدء</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7948739173ca9aa8eabbee69443cef0f">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="np" data-theme="{{theme}}" style="position: relative; width: 100%; min-height: 900px; display: grid; place-items: center; overflow: hidden; background: {{bg}}">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="np-ai-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"></stop><stop offset="1" stop-color="#38bdf8"></stop></linearGradient></defs></svg>
  <sc-if value="{{isChecking}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgb(14 165 233 / .2), transparent 45%)"></div>
    <div class="col fade-in" style="position: relative; align-items: center; gap: 22px; color: #fff" role="status" aria-live="polite">
      <img src="/_blob/c65b65ef75087372ddc981be3cc41199" alt="Newsplus" style="width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 0 0 1px rgb(255 255 255 / .14), 0 24px 60px -20px rgb(14 165 233 / .6)">
      <b style="font-family: var(--f-display); font-size: 30px">Newsplus</b>
      <svg class="pulse-line" width="240" height="40" viewBox="0 0 240 40" aria-hidden="true"><path class="base" d="M0 20h80l10-14 14 28 12-22 8 8h116" style="stroke: rgb(255 255 255 / .12)"></path><path d="M0 20h80l10-14 14 28 12-22 8 8h116"></path></svg>
      <span style="font-size: 14px; color: #a9b8c9">بنتأكد من جلستك ونجهّز غرفة الأخبار…</span>
    </div>
  </sc-if>
  <sc-if value="{{isOffline}}" hint-placeholder-val="{{ false }}">
    <div class="empty fade-in" style="max-width: 460px; padding: 40px">
      <span class="empty__art" style="width: 104px; height: 104px; border-radius: 32px; background: var(--warn-soft); color: var(--warn)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 44px; height: 44px; stroke-width: 1.5"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"></path></svg></span>
      <h1 class="t-hero" style="font-size: 32px">لا يوجد اتصال</h1>
      <p class="t-body">الأخبار والتوليد والترجمة محتاجين إنترنت. هنحاول نفتح Newsplus تاني أول ما الشبكة ترجع.</p>
      <div class="row" style="gap: 10px; margin-top: 8px"><button class="btn btn--ink btn--lg" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg>حاول تاني</button></div>
      <p class="live" style="margin-top: 6px">بنحاول تلقائياً كل ١٥ ثانية</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["checking","offline"],"default":"checking"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.props.state ?? 'checking';
    return { theme: this.props.theme ?? 'light', isChecking: s === 'checking', isOffline: s === 'offline', bg: s === 'checking' ? '#0c2340' : 'var(--bg)' };
  }
}
</script>
</body>
</html>
